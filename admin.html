<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدیریت Cafe Acorn</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="login" class="admin-login"><div class="admin-box">
<h1>🌰 Cafe Acorn</h1><p>ورود مدیریت با حساب Supabase</p>
<input id="email" type="email" placeholder="ایمیل حساب Supabase">
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="login()">ورود</button><small id="loginMsg"></small>
</div></div>
<div id="app" style="display:none">
<header class="admin-head"><b>پنل مدیریت Cafe Acorn</b><div><a href="index.html">مشاهده منو</a><button onclick="logout()">خروج</button></div></header>
<main class="admin-main">
<nav class="admin-tabs"><button onclick="tab('dashboard')">داشبورد</button><button onclick="tab('products')">محصولات و قیمت‌ها</button><button onclick="tab('categories')">دسته‌بندی‌ها</button><button onclick="tab('cafe')">اطلاعات کافه</button></nav>
<section id="dashboard" class="pane"></section>
<section id="products" class="pane" style="display:none"><div class="bar"><h2>محصولات</h2><button onclick="newProduct()">+ افزودن محصول</button></div><div id="productList"></div><div id="editor"></div></section>
<section id="categories" class="pane" style="display:none"><div class="box"><h2>دسته‌بندی‌ها</h2><div class="inline"><input id="catName" placeholder="نام دسته اصلی"><button onclick="addCategory()">افزودن</button></div><div id="catList"></div></div></section>
<section id="cafe" class="pane" style="display:none"><div class="box form"><h2>اطلاعات کافه</h2><label>نام کافه<input id="cName"></label><label>شعار<input id="cTag"></label><label>آدرس<textarea id="cAddress"></textarea></label><label>ساعات کاری<input id="cHours"></label><label>تلفن<input id="cPhone"></label><label>اینستاگرام<input id="cInstagram"></label><label>لینک نقشه<input id="cMap"></label><button onclick="saveCafe()">ذخیره اطلاعات</button></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const cfg=window.CAFE_ACORN_SUPABASE; const sb=window.supabase.createClient(cfg.url,cfg.key);
let cats=[],subs=[],prods=[],settings={};
function msg(t){document.getElementById('loginMsg').textContent=t||''}
async function login(){msg('در حال ورود...');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return msg('ایمیل و رمز عبور را وارد کن.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return msg('ورود ناموفق: '+error.message);const ok=await isAdmin();if(!ok){await sb.auth.signOut();return msg('این حساب دسترسی مدیریت ندارد.')}show()}
async function isAdmin(){const {data,error}=await sb.rpc('is_admin');return !error&&data===true}
async function boot(){const {data}=await sb.auth.getSession();if(data.session&&await isAdmin())show();}
function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';tab('dashboard')}
async function logout(){await sb.auth.signOut();location.reload()}
async function load(){
 const [c,s,p,cs]=await Promise.all([sb.from('categories').select('*').order('sort_order'),sb.from('subcategories').select('*').order('sort_order'),sb.from('products').select('*').order('sort_order'),sb.from('cafe_settings').select('*').limit(1).maybeSingle()]);
 for(const x of [c,s,p,cs])if(x.error)throw x.error;cats=c.data||[];subs=s.data||[];prods=p.data||[];settings=cs.data||{};
}
async function tab(id){document.querySelectorAll('.pane').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';try{await load();if(id==='dashboard')dashboard();if(id==='products')products();if(id==='categories')categories();if(id==='cafe')cafe()}catch(e){alert(e.message)}}
function dashboard(){document.getElementById('dashboard').innerHTML=`<div class="stats"><div><b>${prods.length}</b><span>محصول</span></div><div><b>${prods.filter(x=>x.is_available).length}</b><span>موجود</span></div><div><b>${cats.length}</b><span>دسته</span></div></div><div class="box"><h2>مدیریت آنلاین فعال است</h2><p>تغییرات این پنل مستقیماً در Supabase ذخیره می‌شود و برای همه بازدیدکنندگان منو قابل مشاهده خواهد بود.</p></div>`}
function catForSub(id){return cats.find(c=>c.id===subs.find(s=>s.id===id)?.category_id)}
function products(){document.getElementById('productList').innerHTML=prods.map((p,i)=>{const s=subs.find(x=>x.id===p.subcategory_id);const c=catForSub(p.subcategory_id);return `<div class="product-row"><div class="grow"><b>${esc(p.name)}</b><small>${esc(c?.name||'بدون دسته')} / ${esc(s?.name||'بدون زیر دسته')} · ${Number(p.price).toLocaleString('fa-IR')} هزار تومان</small></div><button onclick="edit(${i})">ویرایش</button><button class="red" onclick="removeP(${i})">حذف</button></div>`}).join('')||'<p>هنوز محصولی ثبت نشده.</p>'}
function editor(p,i){const catId=subs.find(s=>s.id===p.subcategory_id)?.category_id||cats[0]?.id||'';document.getElementById('editor').innerHTML=`<div class="box form"><h2>${i>=0?'ویرایش محصول':'افزودن محصول'}</h2><div class="two"><label>نام<input id="eName" value="${esc(p.name||'')}"></label><label>قیمت (هزار تومان)<input id="ePrice" type="number" value="${p.price||0}"></label></div><label>دسته اصلی<select id="eCat" onchange="refreshSubs()">${cats.map(c=>`<option value="${c.id}" ${c.id===catId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>زیر دسته<select id="eSub">${subs.filter(s=>s.category_id===catId).map(s=>`<option value="${s.id}" ${s.id===p.subcategory_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>توضیحات<textarea id="eDesc">${esc(p.description||'')}</textarea></label><label>مواد تشکیل‌دهنده<textarea id="eIng">${esc(p.ingredients||'')}</textarea></label><label>مواد حساسیت‌زا<input id="eAll" value="${esc(p.allergens||'')}"></label><label>عکس محصول<input id="eImg" type="file" accept="image/*"></label><div><label><input id="eAvail" type="checkbox" ${p.is_available!==false?'checked':''}> موجود</label><label><input id="eSpecial" type="checkbox" ${p.is_special?'checked':''}> پیشنهاد امروز</label><label><input id="eBest" type="checkbox" ${p.is_best_seller?'checked':''}> پرفروش</label></div><button onclick="saveProduct(${i})">ذخیره</button><button class="secondary" onclick="document.getElementById('editor').innerHTML=''">انصراف</button></div>`}
function refreshSubs(){const cid=document.getElementById('eCat').value;document.getElementById('eSub').innerHTML=subs.filter(s=>s.category_id===cid).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
function edit(i){editor(prods[i],i)}
function newProduct(){editor({name:'',price:0,description:'',ingredients:'',allergens:'',is_available:true,is_special:false,is_best_seller:false},-1)}
async function uploadImage(file){const {data:{user}}=await sb.auth.getUser();const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from(cfg.bucket).upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return sb.storage.from(cfg.bucket).getPublicUrl(path).data.publicUrl}
async function saveProduct(i){try{const old=i>=0?prods[i]:{};let image_url=old.image_url||null;const f=document.getElementById('eImg').files[0];if(f)image_url=await uploadImage(f);const row={name:document.getElementById('eName').value.trim(),price:Number(document.getElementById('ePrice').value||0),subcategory_id:document.getElementById('eSub').value||null,description:document.getElementById('eDesc').value,ingredients:document.getElementById('eIng').value,allergens:document.getElementById('eAll').value,image_url,is_available:document.getElementById('eAvail').checked,is_special:document.getElementById('eSpecial').checked,is_best_seller:document.getElementById('eBest').checked};if(!row.name||!row.subcategory_id)throw new Error('نام محصول و زیر دسته را وارد کن.');let r=i<0?await sb.from('products').insert(row):await sb.from('products').update(row).eq('id',old.id);if(r.error)throw r.error;document.getElementById('editor').innerHTML='';await tab('products')}catch(e){alert(e.message)}}
async function removeP(i){if(!confirm('این محصول حذف شود؟'))return;const {error}=await sb.from('products').delete().eq('id',prods[i].id);if(error)alert(error.message);else await tab('products')}
function categories(){document.getElementById('catList').innerHTML=cats.map((c,i)=>{const ss=subs.filter(s=>s.category_id===c.id);return `<div class="cat-row"><b>${esc(c.name)}</b><span>${ss.map(s=>esc(s.name)).join(' · ')||'بدون زیر دسته'}</span><button onclick="renameCat(${i})">تغییر نام</button><button onclick="subCat(${i})">+ زیر دسته</button><button class="red" onclick="delCat(${i})">حذف</button></div>`}).join('')}
async function addCategory(){const n=document.getElementById('catName').value.trim();if(!n)return;const {data,error}=await sb.from('categories').insert({name:n,name_en:n,sort_order:cats.length,is_active:true}).select().single();if(error)return alert(error.message);const r=await sb.from('subcategories').insert({category_id:data.id,name:'عمومی',name_en:'General',sort_order:0,is_active:true});if(r.error)return alert(r.error.message);document.getElementById('catName').value='';await tab('categories')}
async function renameCat(i){const n=prompt('نام جدید',cats[i].name);if(!n)return;const {error}=await sb.from('categories').update({name:n}).eq('id',cats[i].id);if(error)alert(error.message);else await tab('categories')}
async function subCat(i){const n=prompt('نام زیر دسته');if(!n)return;const count=subs.filter(s=>s.category_id===cats[i].id).length;const {error}=await sb.from('subcategories').insert({category_id:cats[i].id,name:n,name_en:n,sort_order:count,is_active:true});if(error)alert(error.message);else await tab('categories')}
async function delCat(i){if(!confirm('دسته، زیر دسته‌ها و محصولات این دسته حذف شوند؟'))return;const ids=subs.filter(s=>s.category_id===cats[i].id).map(s=>s.id);if(ids.length){let r=await sb.from('products').delete().in('subcategory_id',ids);if(r.error)return alert(r.error.message);r=await sb.from('subcategories').delete().eq('category_id',cats[i].id);if(r.error)return alert(r.error.message)}const {error}=await sb.from('categories').delete().eq('id',cats[i].id);if(error)alert(error.message);else await tab('categories')}
function cafe(){document.getElementById('cName').value=settings.cafe_name||'';document.getElementById('cTag').value=settings.tagline||'';document.getElementById('cAddress').value=settings.address||'';document.getElementById('cHours').value=settings.opening_hours||'';document.getElementById('cPhone').value=settings.phone||'';document.getElementById('cInstagram').value=settings.instagram||'';document.getElementById('cMap').value=settings.map_url||''}
async function saveCafe(){const row={cafe_name:cName.value,tagline:cTag.value,address:cAddress.value,phone:cPhone.value,instagram:cInstagram.value,opening_hours:cHours.value,map_url:cMap.value};const id=settings.id||1;const {error}=await sb.from('cafe_settings').update(row).eq('id',id);if(error)alert(error.message);else{alert('اطلاعات ذخیره شد');await tab('cafe')}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
boot();
</script></body></html>
