<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>پنل مدیریت | Cafe Acorn</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:#f4eee9;
      color:#38251d;
    }
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}

    .top{
      background:#3b281f;
      color:#fff;
      padding:24px 18px;
      border-radius:0 0 28px 28px;
      margin-bottom:18px;
    }

    .top-inner{
      max-width:1100px;
      margin:auto;
    }

    .brand{
      font-size:27px;
      font-weight:900;
      line-height:1.5;
    }

    .subtitle{
      opacity:.85;
      margin-top:4px;
    }

    .wrap{
      width:min(1100px,94%);
      margin:auto;
      padding-bottom:40px;
    }

    .card{
      background:#fff;
      border-radius:20px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 5px 22px rgba(0,0,0,.06);
    }

    h2,h3{margin-top:0}

    label{
      display:block;
      font-weight:700;
      margin-bottom:7px;
    }

    input,textarea,select{
      width:100%;
      border:1px solid #ddd2ca;
      border-radius:13px;
      padding:12px 13px;
      background:#fff;
      outline:none;
    }

    input:focus,textarea:focus,select:focus{
      border-color:#3d8b5b;
    }

    textarea{
      min-height:95px;
      resize:vertical;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .full{grid-column:1/-1}

    .btn{
      border:0;
      border-radius:13px;
      padding:12px 18px;
      font-weight:800;
    }

    .green{
      background:#348554;
      color:#fff;
    }

    .brown{
      background:#3b281f;
      color:#fff;
    }

    .light{
      background:#eee4dc;
      color:#38251d;
    }

    .danger{
      background:#b83b3b;
      color:#fff;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .tab{
      border:0;
      padding:11px 16px;
      border-radius:12px;
      background:#e6dbd3;
      color:#38251d;
      font-weight:800;
    }

    .tab.active{
      background:#3b281f;
      color:#fff;
    }

    .hidden{display:none!important}

    .product{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:15px;
      padding:14px;
      border:1px solid #eadfd8;
      border-radius:17px;
      margin-bottom:12px;
    }

    .product img{
      width:110px;
      height:110px;
      object-fit:cover;
      border-radius:15px;
      background:#eee;
    }

    .product-title{
      font-size:18px;
      font-weight:900;
    }

    .price{
      font-weight:900;
      color:#348554;
      margin-top:5px;
    }

    .muted{
      color:#777;
      font-size:13px;
    }

    .tag{
      display:inline-block;
      background:#f0e5dc;
      border-radius:20px;
      padding:5px 9px;
      margin:4px 3px;
      font-size:12px;
      font-weight:700;
    }

    .success,.error,.info{
      border-radius:13px;
      padding:12px 14px;
      margin-top:12px;
      font-weight:700;
    }

    .success{background:#e2f5e8;color:#216238}
    .error{background:#fde5e5;color:#9c2e2e}
    .info{background:#e8f1ff;color:#24548a}

    .preview{
      width:150px;
      height:150px;
      object-fit:cover;
      border-radius:18px;
      display:block;
      margin-top:10px;
      background:#eee;
    }

    .check{
      display:flex;
      align-items:center;
      gap:9px;
      font-weight:700;
    }

    .check input{
      width:22px;
      height:22px;
    }

    .login-box{
      width:min(480px,92%);
      margin:60px auto;
    }

    .center{text-align:center}

    .loading{
      padding:25px;
      text-align:center;
      color:#777;
    }

    @media(max-width:700px){
      .grid{grid-template-columns:1fr}
      .product{grid-template-columns:85px 1fr}
      .product img{
        width:85px;
        height:85px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<section id="loginView">
  <div class="login-box card">
    <div class="center">
      <div style="font-size:45px">🌰</div>
      <h1>Cafe Acorn</h1>
      <p>ورود صاحب سایت</p>
    </div>

    <div id="loginMessage"></div>

    <label>ایمیل</label>
    <input id="loginEmail" type="email" autocomplete="email">

    <br><br>

    <label>رمز عبور</label>
    <input id="loginPassword" type="password" autocomplete="current-password">

    <br>

    <button class="btn green" style="width:100%" onclick="login()">
      ورود به پنل
    </button>

    <br><br>

    <button class="btn light" style="width:100%" onclick="showForgot()">
      رمز عبور را فراموش کرده‌ام
    </button>
  </div>
</section>

<!-- FORGOT -->
<section id="forgotView" class="hidden">
  <div class="login-box card">
    <div class="center">
      <div style="font-size:40px">🔐</div>
      <h2>بازیابی رمز عبور</h2>
      <p>ایمیل حساب Supabase را وارد کنید.</p>
    </div>

    <div id="forgotMessage"></div>

    <label>ایمیل</label>
    <input id="forgotEmail" type="email">

    <br><br>

    <button class="btn green" style="width:100%" onclick="sendReset()">
      ارسال لینک تغییر رمز
    </button>

    <br><br>

    <button class="btn light" style="width:100%" onclick="showLogin()">
      بازگشت به ورود
    </button>
  </div>
</section>

<!-- RESET PASSWORD -->
<section id="resetView" class="hidden">
  <div class="login-box card">
    <div class="center">
      <div style="font-size:40px">🔑</div>
      <h2>تعیین رمز جدید</h2>
    </div>

    <div id="resetMessage"></div>

    <label>رمز جدید</label>
    <input id="newPassword" type="password">

    <br><br>

    <label>تکرار رمز جدید</label>
    <input id="newPassword2" type="password">

    <br><br>

    <button class="btn green" style="width:100%" onclick="saveNewPassword()">
      ذخیره رمز جدید
    </button>
  </div>
</section>

<!-- ADMIN -->
<section id="adminView" class="hidden">

  <header class="top">
    <div class="top-inner">
      <div class="brand">🌰 Cafe Acorn</div>
      <div class="subtitle">پنل مدیریت کامل منو</div>
      <br>
      <button class="btn light" onclick="logout()">خروج</button>
    </div>
  </header>

  <main class="wrap">

    <div class="tabs">
      <button class="tab active" id="tabProducts" onclick="showTab('products')">
        محصولات
      </button>

      <button class="tab" id="tabCategories" onclick="showTab('categories')">
        دسته‌بندی‌ها
      </button>

      <button class="tab" id="tabSubcategories" onclick="showTab('subcategories')">
        زیر‌دسته‌ها
      </button>

      <button class="tab" id="tabSettings" onclick="showTab('settings')">
        اطلاعات کافه
      </button>
    </div>

    <!-- PRODUCTS -->
    <section id="productsTab">

      <div class="card">
        <h2 id="productFormTitle">➕ افزودن محصول</h2>

        <div id="productMessage"></div>

        <input type="hidden" id="productId">

        <div class="grid">

          <div>
            <label>نام محصول</label>
            <input id="productName" placeholder="مثلاً اسپرسو">
          </div>

          <div>
            <label>قیمت</label>
            <input id="productPrice" type="number" placeholder="150">
          </div>

          <div>
            <label>دسته‌بندی</label>
            <select id="productCategory" onchange="loadSubcategoriesForForm()">
              <option value="">انتخاب کنید</option>

          </div>

          <div>
            <label>زیر‌دسته</label>

              <option value="">انتخاب کنید</option>
            </select>
          </div>

          <div class="full">
            <label>توضیح</label>
            <textarea id="productDescription"
              placeholder="توضیح کوتاه و اشتها‌آور محصول"></textarea>
          </div>

          <div class="full">

            <textarea id="productIngredients"
              placeholder="مثلاً اسپرسو، شیر، سیروپ کارامل"></textarea>
          </div>

          <div class="full">

          <div>
            <label>ترتیب نمایش</label>

          <div>
            <label>عکس محصول</label>
            <input id="productImage"
              type="file"

            <div id="uploadMessage"></div>

          <div class="full">
            <label class="check">
              <input id="productAvailable" type="checkbox" checked>
              نمایش محصول در منو
            </label>
          </div>

          <div>
            <label class="check">
              <input id="productSpecial" type="checkbox">
              پیشنهاد امروز
            </label>
          </div>

          <div>
            <label class="check">
              <input id="productBestSeller" type="checkbox">
              پرفروش

        </div>

        <br>

        <div class="row">

      <div class="card">

        <div id="productsList" class="loading">در حال دریافت...</div>

    <!-- CATEGORIES -->
    <section id="categoriesTab" class="hidden">

      <div class="card">
        <h2>➕ افزودن دسته‌بندی</h2>

        <div id="categoryMessage"></div>

        <input type="hidden" id="categoryId">

        <div class="grid">
          <div>
            <label>نام دسته‌بندی</label>
            <input id="categoryName">
          </div>

          <div>
            <label>ترتیب</label>
            <input id="categorySort" type="number" value="0">

        </div>

        <label class="check">
          <input id="categoryActive" type="checkbox" checked>
          فعال

          <button class="btn green" onclick="saveCategory()">

        <h2>دسته‌بندی‌ها</h2>

    </section>

    <!-- SUBCATEGORIES -->
    <section id="subcategoriesTab" class="hidden">

      <div class="card">
        <h2>➕ افزودن زیر‌دسته</h2>

        <div class="grid">

          <div>
            <label>دسته اصلی</label>

          </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const CONFIG = window.CAFE_ACORN_SUPABASE;

if (!CONFIG || !CONFIG.url || !CONFIG.anonKey) {
  document.body.innerHTML =
    '<div style="padding:30px;font-family:Tahoma">خطا: فایل supabase-config.js پیدا نشد.</div>';
  throw new Error('Supabase config missing');
}

const supabaseClient = window.supabase.createClient(
  CONFIG.url,
  CONFIG.anonKey
);

const BUCKET = 'product-images';

let categories = [];
let subcategories = [];
let products = [];

let currentProductImageUrl = '';
let currentProductImagePath = '';

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function message(id,text,type='info'){
  const el=$(id);
  if(!el)return;

  el.innerHTML =
    '<div class="'+type+'">'+escapeHTML(text)+'</div>';
}

function clearMessage(id){
  const el=$(id);
  if(el) el.innerHTML='';
}

/* =========================================================
   VIEWS
========================================================= */

function hideAllViews(){
  $('loginView').classList.add('hidden');
  $('forgotView').classList.add('hidden');
  $('resetView').classList.add('hidden');
  $('adminView').classList.add('hidden');
}

function showLogin(){
  hideAllViews();
  $('loginView').classList.remove('hidden');
}

function showForgot(){
  hideAllViews();
  $('forgotView').classList.remove('hidden');

  $('forgotEmail').value =
    $('loginEmail').value || '';
}

function showReset(){
  hideAllViews();
  $('resetView').classList.remove('hidden');
}

function showAdmin(){
  hideAllViews();
  $('adminView').classList.remove('hidden');
}

function showTab(tab){

  const tabs = [
    'products',
    'categories',
    'subcategories',
    'settings'
  ];

  tabs.forEach(t=>{
    $(t+'Tab').classList.toggle(
      'hidden',
      t!==tab
    );

    const button=$('tab'+t.charAt(0).toUpperCase()+t.slice(1));

    if(button){
      button.classList.toggle(
        'active',
        t===tab
      );
    }
  });
}

/* =========================================================
   AUTH
========================================================= */

async function login(){

  clearMessage('loginMessage');

  const email=$('loginEmail').value.trim();
  const password=$('loginPassword').value;

  if(!email || !password){
    message(
      'loginMessage',
      'ایمیل و رمز عبور را وارد کنید.',
      'error'
    );
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    message(
      'loginMessage',
      error.message || 'ورود انجام نشد.',
      'error'
    );
    return;
  }

  await checkAdminAndOpen(data.session);
}

async function checkAdminAndOpen(session){

  if(!session){
    showLogin();
    return;
  }

  /*
    is_admin() قبلاً در پروژه Cafe Acorn ساخته شده.
    اگر حساب واردشده مدیر نباشد، پنل باز نمی‌شود.
  */

  const {data,isAdminError} =
    await supabaseClient.rpc('is_admin');

  if(isAdminError){
    message(
      'loginMessage',
      'بررسی دسترسی مدیر انجام نشد. جزئیات: '+isAdminError.message,
      'error'
    );

    await supabaseClient.auth.signOut();
    return;
  }

  if(data !== true){
    message(
      'loginMessage',
      'این حساب دسترسی مدیر ندارد.',
      'error'
    );

    await supabaseClient.auth.signOut();
    return;
  }

  showAdmin();
  await loadEverything();
}

async function logout(){
  await supabaseClient.auth.signOut();
  showLogin();
}

async function sendReset(){

  clearMessage('forgotMessage');

  const email=$('forgotEmail').value.trim();

  if(!email){
    message(
      'forgotMessage',
      'ایمیل را وارد کنید.',
      'error'
    );
    return;
  }

  const redirectTo =
    'https://mahdikingman1381-glitch.github.io/cafe-acorn/admin.html';

  const {error} =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {redirectTo}
    );

  if(error){
    message(
      'forgotMessage',
      error.message,
      'error'
    );
    return;
  }

  message(
    'forgotMessage',
    'لینک تغییر رمز ارسال شد. ایمیل را بررسی کنید.',
    'success'
  );
}

async function saveNewPassword(){

  clearMessage('resetMessage');

  const p1=$('newPassword').value;
  const p2=$('newPassword2').value;

  if(!p1 || p1.length<6){
    message(
      'resetMessage',
      'رمز جدید باید حداقل ۶ کاراکتر باشد.',
      'error'
    );
    return;
  }

  if(p1!==p2){
    message(
      'resetMessage',
      'دو رمز یکسان نیستند.',
      'error'
    );
    return;
  }

  const {error} =
    await supabaseClient.auth.updateUser({
      password:p1
    });

  if(error){
    message(
      'resetMessage',
      error.message,
      'error'
    );
    return;
  }

  message(
    'resetMessage',
    'رمز با موفقیت تغییر کرد. چند لحظه صبر کنید...',
    'success'
  );

  setTimeout(async()=>{
    await supabaseClient.auth.signOut();
    showLogin();
  },1500);
}

/* =========================================================
   RECOVERY EVENT
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(event==='PASSWORD_RECOVERY'){
      showReset();
      return;
    }

    if(event==='SIGNED_IN' && session){

      /*
        اگر لینک بازیابی بود، resetView باید نمایش داده شود.
      */

      if(location.hash.includes('type=recovery')){
        showReset();
        return;
      }

    }

    if(event==='SIGNED_OUT'){
      showLogin();
    }
  }
);

/* =========================================================
   INITIAL SESSION
========================================================= */

(async function(){

  const {data} =
    await supabaseClient.auth.getSession();

  const session=data.session;

  if(location.hash.includes('type=recovery')){
    showReset();
    return;
  }

  if(session){
    await checkAdminAndOpen(session);
  }else{
    showLogin();
  }

})();

/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadEverything(){

  await loadCategories();
  await loadSubcategories();
  await loadProducts();
  await loadSettings();

  populateCategorySelects();
  renderCategories();
  renderSubcategories();
  renderProducts();
}

/* =========================================================
   CATEGORIES
========================================================= */

async function loadCategories(){

  const {data,error} =
    await supabaseClient
      .from('categories')
      .select('*')
      .order('sort_order',{ascending:true});

  if(error){
    message(
      'categoryMessage',
      error.message,
      'error'
    );
    return;
  }

  categories=data||[];
}

function populateCategorySelects(){

  const selects=[
    $('productCategory'),
    $('subcategoryCategory')
  ];

  selects.forEach(select=>{
    if(!select)return;

    select.innerHTML =
      '<option value="">انتخاب کنید</option>';

    categories.forEach(c=>{
      select.innerHTML +=
        '<option value="'+escapeHTML(c.id)+'">'+
        escapeHTML(c.name)+
        '</option>';
    });
  });
}

async function saveCategory(){

  clearMessage('categoryMessage');

  const id=$('categoryId').value;
  const name=$('categoryName').value.trim();
  const sort=Number($('categorySort').value||0);
  const active=$('categoryActive').checked;

  if(!name){
    message(
      'categoryMessage',
      'نام دسته‌بندی را وارد کنید.',
      'error'
    );
    return;
  }

  const payload={
    name,
    sort_order:sort,
    is_active:active
  };

  let result;

  if(id){
    result=await supabaseClient
      .from('categories')
      .update(payload)
      .eq('id',id);
  }else{
    result=await supabaseClient
      .from('categories')
      .insert(payload);
  }

  if(result.error){
    message(
      'categoryMessage',
      result.error.message,
      'error'
    );
    return;
  }

  message(

/* =========================================================
   PRODUCTS
========================================================= */

async function loadProducts(){

  const {data,error} =
    await supabaseClient
      .from('products')
      .select('*')
      .order('sort_order',{ascending:true});

  if(error){
    message(
      'productMessage',
      error.message,
      'error'
    );
    return;
  }

  products=data||[];
}

function renderProducts(){

  const el=$('productsList');

  if(!products.length){
    el.innerHTML=
      '<div class="muted">محصولی وجود ندارد.</div>';
    return;
  }

  el.innerHTML=products.map(p=>{

    const img =
      p.image_url ||
      'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=300&q=80';

    return `

      <div class="product">

        <img src="${escapeHTML(img)}">

        <div>

          <div class="product-title">
            ${escapeHTML(p.name)}
          </div>

          <div class="price">
            ${escapeHTML(p.price)} تومان
          </div>

          <div class="muted">
            ${escapeHTML(categoryName(p.category_id))}
          </div>

          ${p.description
            ? '<p>'+escapeHTML(p.description)+'</p>'
            : ''}

          ${p.ingredients
            ? '<div class="tag">مواد: '+escapeHTML(p.ingredients)+'</div>'
            : ''}

          ${p.allergens
            ? '<div class="tag">آلرژن: '+escapeHTML(p.allergens)+'</div>'
            : ''}

          ${p.is_special
            ? '<span class="tag">⭐ پیشنهاد امروز</span>'
            : ''}

          ${p.is_best_seller
            ? '<span class="tag">🔥 پرفروش</span>'
            : ''}

          ${p.is_available===false
            ? '<span class="tag">ناموجود</span>'
            : ''}

          <br><br>

          <div class="row">

            <button class="btn light"
              onclick="editProduct('${p.id}')">
              ویرایش
            </button>

            <button class="btn danger"
              onclick="deleteProduct('${p.id}')">
              حذف
            </button>

          </div>

        </div>

      </div>

    `;
  }).join('');
}

function editProduct(id){

  const p=products.find(
    x=>String(x.id)===String(id)
  );

  if(!p)return;

  showTab('products');

  $('productId').value=p.id;
  $('productName').value=p.name||'';
  $('productPrice').value=p.price??'';
  $('productCategory').value=p.category_id||'';

  loadSubcategoriesForForm();

  $('productSubcategory').value=
    p.subcategory_id||'';

  $('productDescription').value=
    p.description||'';

  $('productIngredients').value=
    p.ingredients||'';

  $('productAllergens').value=
    p.allergens||'';

  $('productSort').value=
    p.sort_order||0;

  $('productAvailable').checked=
    p.is_available!==false;

  $('productSpecial').checked=
    p.is_special===true;

  $('productBestSeller').checked=
    p.is_best_seller===true;

  currentProductImageUrl=
    p.image_url||'';

  currentProductImagePath='';

  if(p.image_url){

    $('imagePreview').src=p.image_url;
    $('imagePreview').classList.remove('hidden');

  }else{

    $('imagePreview').classList.add('hidden');

  }

  $('productFormTitle').textContent=
    '✏️ ویرایش محصول';

  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteProduct(id){

  if(!confirm('این محصول حذف شود؟'))return;

  const product=
    products.find(
      x=>String(x.id)===String(id)
    );

  /*
    اول رکورد محصول را حذف می‌کنیم.
    عکس قدیمی را هم اگر قابل تشخیص باشد حذف می‌کنیم.
  */

  const {error} =
    await supabaseClient
      .from('products')
      .delete()
      .eq('id',id);

  if(error){
    alert(error.message);
    return;
  }

  if(product && product.image_url){
    /*
      حذف Storage اختیاری است؛
      اگر URL متعلق به bucket ما باشد تلاش می‌کنیم.
    */
    try{
      const marker='/storage/v1/object/public/'+BUCKET+'/';

      if(product.image_url.includes(marker)){
        const path=
          decodeURIComponent(
            product.image_url.split(marker)[1]
          );

        await supabaseClient
          .storage
          .from(BUCKET)
          .remove([path]);
      }
    }catch(e){}
  }

  await loadProducts();
  renderProducts();
}

function previewImage(event){

  clearMessage('uploadMessage');

  const file=event.target.files?.[0];

  if(!file){
    $('imagePreview').classList.add('hidden');
    return;
  }

  if(!file.type.startsWith('image/')){
    message(
      'uploadMessage',
      'فقط فایل تصویری انتخاب کنید.',
      'error'
    );

    event.target.value='';
    return;
  }

  const maxSize=8*1024*1024;

  if(file.size>maxSize){
    message(
      'uploadMessage',
      'حجم عکس نباید بیشتر از ۸ مگابایت باشد.',
      'error'
    );

    event.target.value='';
    return;
  }

  const url=URL.createObjectURL(file);

  $('imagePreview').src=url;
  $('imagePreview').classList.remove('hidden');
}

/* =========================================================
   IMPORTANT: IMAGE UPLOAD
========================================================= */

async function uploadProductImage(file){

  if(!file){
    return {
      url:currentProductImageUrl || '',
      path:''
    };
  }

  clearMessage('uploadMessage');

  /*
    مطمئن می‌شویم کاربر هنوز وارد حساب است.
  */

  const {
    data:sessionData
  } = await supabaseClient.auth.getSession();

  if(!sessionData.session){
    throw new Error(
      'نشست ورود منقضی شده است. دوباره وارد پنل شوید.'
    );
  }

  /*
    اسم فایل کاملاً یکتا است تا
    خطای Asset Already Exists نگیریم.
  */

  const extension =
    (file.name.split('.').pop() || 'jpg')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');

  const unique =
    (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now()+'-'+Math.random().toString(36).slice(2);

  const path =
    'products/'+unique+'.'+extension;

  const {data,error} =
    await supabaseClient
      .storage
      .from(BUCKET)
      .upload(
        path,
        file,
        {
          cacheControl:'3600',
          contentType:file.type || 'image/jpeg',
          upsert:false
        }
      );

  if(error){

    console.error('SUPABASE UPLOAD ERROR:',error);

    throw new Error(
      'آپلود عکس انجام نشد: '+
      (error.message || error.error || 'خطای نامشخص')
    );
  }

  const {
    data:publicData
  } =
    supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(path);

  const publicUrl=
    publicData?.publicUrl || '';

  if(!publicUrl){
    throw new Error(
      'عکس آپلود شد اما آدرس عمومی عکس ساخته نشد.'
    );
  }

  return {
    url:publicUrl,
    path
  };
}

/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(){

  clearMessage('productMessage');
  clearMessage('uploadMessage');

  const id=$('productId').value;

  const name=$('productName').value.trim();
  const price=$('productPrice').value;
  const categoryId=$('productCategory').value;
  const subcategoryId=$('productSubcategory').value;

  if(!name){
    message(
      'productMessage',
      'نام محصول را وارد کنید.',
      'error'
    );
    return;
  }

  if(price==='' || price===null){
    message(
      'productMessage',
      'قیمت محصول را وارد کنید.',
      'error'
    );
    return;
  }

  if(!categoryId){
    message(
      'productMessage',
      'دسته‌بندی را انتخاب کنید.',
      'error'
    );
    return;
  }

  const file=
    $('productImage').files?.[0] || null;

  let imageUrl=
    currentProductImageUrl || '';

  try{

    if(file){

      message(
        'uploadMessage',
        'در حال آپلود عکس...',
        'info'
      );

      const result=
        await uploadProductImage(file);

      imageUrl=result.url;

      message(
        'uploadMessage',
        'عکس با موفقیت آپلود شد.',
        'success'
      );
    }

    const payload={

      name,

      price:Number(price),

      category_id:categoryId,

      subcategory_id:
        subcategoryId || null,

      description:
        $('productDescription').value.trim() || null,

      ingredients:
        $('productIngredients').value.trim() || null,

      allergens:
        $('productAllergens').value.trim() || null,

      sort_order:
        Number($('productSort').value || 0),

      image_url:
        imageUrl || null,

      is_available:
        $('productAvailable').checked,

      is_special:
        $('productSpecial').checked,

      is_best_seller:
        $('productBestSeller').checked
    };

    let result;

    if(id){

      result=
        await supabaseClient
          .from('products')
          .update(payload)
          .eq('id',id);

    }else{

      result=
        await supabaseClient
          .from('products')
          .insert(payload);

    }

    if(result.error){

      message(
        'productMessage',
        result.error.message,
        'error'
      );

      return;
    }

    message(
      'productMessage',
      'محصول با موفقیت ذخیره شد.',
      'success'
    );

    clearProductForm();

    await loadProducts();
    renderProducts();

  }catch(error){

    console.error(error);

    message(
      'productMessage',
      error.message || 'خطا در ذخیره محصول.',
      'error'
    );
  }
}

function clearProductForm(){

  $('productId').value='';
  $('productName').value='';
  $('productPrice').value='';
  $('productCategory').value='';
  $('productSubcategory').innerHTML=
    '<option value="">انتخاب کنید</option>';

  $('productDescription').value='';
  $('productIngredients').value='';
  $('productAllergens').value='';
  $('productSort').value=0;

  $('productAvailable').checked=true;
  $('productSpecial').checked=false;
  $('productBestSeller').checked=false;

  $('productImage').value='';

  $('imagePreview').src='';
  $('imagePreview').classList.add('hidden');

  currentProductImageUrl='';
  currentProductImagePath='';

  $('productFormTitle').textContent=
    '➕ افزودن محصول';

  clearMessage('productMessage');
  clearMessage('uploadMessage');
}

async function saveSettings(){

  const payload={

    name:$('cafeName').value.trim(),

    tagline:$('cafeTagline').value.trim(),

    address:$('cafeAddress').value.trim(),

      .from('cafe_settings')

      .maybeSingle();

  if(findError){

      'settingsMessage',
      findError.message,

    return;

  let result;

  if(existing?.id){

    result=
      await supabaseClient
        .from('cafe_settings')
        .update(payload)
        .eq('id',existing.id);

  }else{

    result=
      await supabaseClient
        .from('cafe_settings')
        .insert(payload);

  }

  if(result.error){

    message(
      'settingsMessage',
      result.error.message,
      'error'
    );

    return;
  }

  message(
    'settingsMessage',
    'اطلاعات کافه ذخیره شد.',
    'success'
  );
